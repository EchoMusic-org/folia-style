# 发布流程：推 v* tag 自动构建插件包并发布 GitHub Release。
# 产物：folia-style-<版本>.zip，解压后目录即插件根（manifest.json 在顶层），可直接放入主程序 plugins/ 目录。
# 构建内容：全量 JS 语法检查 → 雾笺笔顺数据自动生成（AnimCJK，Arphic 授权文本随附）→ manifest 版本对齐 tag → 打包。
# 更新日志：上一个 tag（没有则全部）到本次的 commit 标题逐条汇总。
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码（完整历史与 tags，供更新日志取上一个 tag）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 版本对齐（tag vA.B.C → manifest.json）
        run: node dev/set-manifest-version.mjs "${GITHUB_REF_NAME#v}"
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: 全量 JS 语法检查
        run: |
          find . -name '*.js' -not -path './.git/*' -not -path './dev/*' -print0 | xargs -0 -n1 node --check

      - name: 生成雾笺笔顺数据（AnimCJK，许可文本已随附在 folia/assets/licenses/）
        run: node dev/build-nebbia-strokes.mjs

      - name: 打包（zip 根目录即插件根）
        run: |
          VER="${GITHUB_REF_NAME#v}"
          zip -r "folia-style-${VER}.zip" manifest.json index.js style.css folia
          unzip -l "folia-style-${VER}.zip" | head -8
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: 生成更新日志（取自提交标题）
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            git log "$PREV_TAG".."${GITHUB_SHA}" --pretty=format:"- %s" > release_notes.md
          else
            git log --pretty=format:"- %s" > release_notes.md
          fi

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: folia-style-*.zip
          body_path: release_notes.md
