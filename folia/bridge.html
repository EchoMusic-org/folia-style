<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Folia Lyrics</title>
<meta name="referrer" content="no-referrer">
<link rel="stylesheet" href="css/base.css">
</head>
<body>
<div id="app">
  <!-- 新背景系统宿主：6 种背景自持 DOM 挂载点（z-index 低于歌词模式层） -->
  <div id="folia-bg-host" style="position:absolute;inset:0;overflow:hidden;z-index:1;"></div>
  <!-- 新歌词模式宿主：13 种模式自持 DOM 挂载点 -->
  <div id="folia-mode-host" style="position:absolute;inset:0;overflow:hidden;z-index:5;"></div>
  <!-- 旧几何背景层：已由新背景系统接管，默认隐藏（updateLegacyLayers 控制） -->
  <div class="geo-layer" id="geo-layer" style="display:none"></div>
  <div class="center-glow"></div>
  <div class="blur-bg-layer" id="blur-bg-layer"></div>
  <div class="lyrics-layer" id="lyrics-layer"></div>
  <!-- 窗口控制按钮 (JS 动态创建) -->
  <div id="win-controls"></div>
  <!-- 左上角关闭按钮 (关闭当前页面) -->
  <button class="close-overlay-btn" id="close-overlay-btn" title="关闭">
    <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
  </button>
  <!-- 右下角设置按钮 -->
  <button class="settings-btn" id="settings-btn" title="设置">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10a2 2 0 1 0 4 0a2 2 0 0 0-4 0m2-6v4m0 4v8m4-4a2 2 0 1 0 4 0a2 2 0 0 0-4 0m2-12v10m0 4v2m4-13a2 2 0 1 0 4 0a2 2 0 0 0-4 0m2-3v1m0 4v11"/></svg>
  </button>
  <!-- 设置菜单 -->
  <div class="settings-menu" id="settings-menu">
    <div class="sm-cover" id="sm-cover">
      <div class="sm-cover-placeholder">♪</div>
    </div>
    <div class="sm-actions">
      <button class="sm-action-btn active" id="sm-btn-radio" title="音乐">
        <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </button>
      <button class="sm-action-btn" id="sm-btn-settings" title="设置">
        <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10a2 2 0 1 0 4 0a2 2 0 0 0-4 0m2-6v4m0 4v8m4-4a2 2 0 1 0 4 0a2 2 0 0 0-4 0m2-12v10m0 4v2m4-13a2 2 0 1 0 4 0a2 2 0 0 0-4 0m2-3v1m0 4v11"/></svg>
      </button>
      <button class="sm-action-btn" id="sm-btn-playlist" title="播放列表">
        <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg>
      </button>
    </div>
    <div class="sm-info">
      <div class="sm-title" id="sm-title">-</div>
      <div class="sm-artist" id="sm-artist">-</div>
      <div class="sm-album" id="sm-album">-</div>
    </div>
    <!-- 设置子页面（样式调节已统一收口到"歌词样式设置"二级窗口） -->
    <div class="sm-settings" id="sm-settings">
      <!-- 歌词样式设置入口 -->
      <button class="sm-style-entry" id="sm-btn-style-window" type="button">
        <span class="sm-style-entry-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </span>
        <span class="sm-style-entry-text">
          <span class="sm-style-entry-title">歌词样式设置</span>
          <span class="sm-style-entry-desc">动画 · 背景 · 字体 · 字幕</span>
        </span>
        <svg class="sm-style-entry-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </button>
      <!-- 两个大按钮 -->
      <div class="sm-big-btns">
        <button class="sm-big-btn" id="sm-btn-mode" title="播放模式">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 14-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        </button>
        <button class="sm-big-btn" id="sm-btn-fav" title="收藏">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </button>
      </div>
      <!-- 音量控制 -->
      <div class="sm-volume">
        <div class="sm-volume-header">
          <span class="sm-volume-label">音量</span>
          <span class="sm-volume-value" id="sm-volume-value">100%</span>
        </div>
        <div class="sm-volume-row">
          <span class="sm-volume-icon">
            <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
          </span>
          <div class="sm-volume-track" id="sm-volume-track">
            <div class="sm-volume-fill" id="sm-volume-fill" style="width:100%"></div>
            <div class="sm-volume-thumb" id="sm-volume-thumb" style="left:100%"></div>
          </div>
        </div>
      </div>
    </div>
    <!-- 播放列表子页面 -->
    <div class="sm-queue" id="sm-queue">
      <div class="sm-queue-header">
        <span><span class="sm-queue-title">播放队列</span> <span class="sm-queue-count" id="sm-queue-count">(0)</span></span>
        <div class="sm-queue-actions">
          <button class="sm-queue-shuffle" id="sm-queue-shuffle" title="随机播放">
            <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
          </button>
          <button class="sm-queue-locate" id="sm-queue-locate" title="定位当前歌曲">
            <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div class="sm-queue-list" id="sm-queue-list"></div>
    </div>
    <button class="sm-close" id="sm-close" title="关闭">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
  </div>
  <div class="queue-panel" id="queue-panel">
    <div class="queue-header">
      <div><div class="queue-title">播放队列</div><div class="queue-count" id="queue-count">0 首</div></div>
      <button class="ctrl-icon-btn" id="queue-close" style="width:28px;height:28px">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="queue-list" id="queue-list"></div>
  </div>
  <!-- 旧莫奈静态容器已删除：新 monet 模式自建 DOM 挂载于 #folia-mode-host -->
  <div class="bottom-bar" id="bottom-bar">
    <!-- 副歌词 (翻译/读音) -->
    <div class="subtitle-bar" id="subtitle-bar"></div>
    <div class="ctrl-capsule">
      <!-- 左: 播放/暂停 -->
      <button class="ctrl-play" id="btn-play" title="播放/暂停">
        <svg id="icon-play" width="18" height="18" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg id="icon-pause" width="18" height="18" viewBox="0 0 24 24" style="display:none"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
      </button>
      <!-- 中: 上一曲 + 标题 + 下一曲 (展开模式显示) -->
      <div class="ctrl-center">
        <button class="ctrl-sm-btn" id="btn-prev" title="上一首">
          <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <div class="ctrl-title" id="ctrl-title"></div>
        <button class="ctrl-sm-btn" id="btn-next" title="下一首">
          <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>
      <!-- 进度条 (始终显示) -->
      <div class="ctrl-progress-row">
        <span class="ctrl-time" id="time-current">0:00</span>
        <div class="ctrl-progress" id="ctrl-progress">
          <div class="ctrl-progress-fill" id="progress-fill"></div>
        </div>
        <span class="ctrl-time" id="time-duration">0:00</span>
      </div>
      <!-- 右: 模式+列表 -->
      <div class="ctrl-side">
        <button class="ctrl-icon-btn" id="btn-mode" title="播放模式">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 14-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        </button>
        <button class="ctrl-icon-btn" id="fav-btn" title="收藏">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- 新歌词体系运行时与注册表（加载顺序敏感：依赖自上而下；模式/背景脚本由注册表按需懒加载） -->
<script src="runtime/color-mix.js"></script>
<script src="runtime/grapheme-timing.js"></script>
<script src="runtime/word-segmentation.js"></script>
<script src="runtime/render-hints.js"></script>
<script src="runtime/visualizer-runtime.js"></script>
<script src="runtime/sentence-layout.js"></script>
<script src="runtime/cjk-semantic-layout.js"></script>
<script src="runtime/word-coloring.js"></script>
<script src="runtime/anim.js"></script>
<script src="runtime/theme.js"></script>
<script src="runtime/lyrics-data.js"></script>
<script src="runtime/tunings.js"></script>
<script src="runtime/seed-hash.js"></script>
<script src="runtime/theme-color-math.js"></script>
<script src="runtime/beatfx.js"></script>
<script src="runtime/dual-theme.js"></script>
<script src="runtime/subtitle-overlay.js"></script>
<script src="runtime/registry.js"></script>
<script src="backgrounds/paper-mount.js"></script>
<script src="backgrounds/background-registry.js"></script>
<!-- 样式设置二级窗口（面板样式项统一收口于此，复刻上游 VisPlayground） -->
<link rel="stylesheet" href="window/style-window.css">
<script src="window/panel-kit.js"></script>
<script src="window/sample-stage.js"></script>
<script src="window/frozen-picture.js"></script>
<script src="window/style-window.js" defer></script>
<script>
(function(){
'use strict';

// ===== 歌词字体（字体族由宿主设置；字号/字重由插件样式设置窗口设置） =====
var foliaDefaultFont='"Inter","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif'
var foliaLyricFontFamily=''
window.foliaGetLyricFontFamily=function(){
  return foliaLyricFontFamily||foliaDefaultFont
}
function applyLyricFontFamily(family){
  var f=String(family||'').trim()
  foliaLyricFontFamily=f
  document.documentElement.style.setProperty('--lyric-font-family',f||foliaDefaultFont)
}
// 字重覆盖：0 = 自动（各模式内置字重），100~900 = 全局覆盖（模式经 foliaGetLyricFontWeight 取值）
window.foliaGetLyricFontWeight=function(fallback){
  var appearance=window.FoliaTunings?window.FoliaTunings.getAppearance():null
  return appearance&&appearance.fontWeight>=100?appearance.fontWeight:(fallback||400)
}
function applyLyricFontWeight(weight){
  var appearance=window.FoliaTunings?window.FoliaTunings.getAppearance():null
  var w=Number.isFinite(Number(weight))?Number(weight):(appearance?appearance.fontWeight:0)
  if(w>=100){
    document.documentElement.style.setProperty('--lyric-font-weight',String(Math.round(w)))
  }else{
    document.documentElement.style.removeProperty('--lyric-font-weight')
  }
}

// ===== 歌词过滤 =====
var DEFAULT_LYRIC_FILTER_REGEX='^([^：]*)：.*$|^([^:]*):.*$|^([^翻唱]*)翻唱.*$|^([^许可]*)许可.*$|^([^音乐人]*)音乐人.*$|^([^国风]*)国风.*$|^([^纯音乐]*)纯音乐.*$|^([^星曜计划]*)星曜计划.*$'
var lyricFilterEnabled=localStorage.getItem('folia-lyricFilterEnabled')!=='false'
var lyricFilterRegex=''
try{lyricFilterRegex=localStorage.getItem('folia-lyricFilterRegex')||''}catch(e){}
lyricFilterRegex=(function(v){v=String(v||'').trim();if(!v)return '';try{new RegExp(v);return v}catch(e){return DEFAULT_LYRIC_FILTER_REGEX}})(lyricFilterRegex)
var rawLyricLines=[]

// ===== 状态 =====
var S={
  track:null,isPlaying:false,currentTimeMs:0,durationMs:0,
  volume:100,playMode:'list',queue:[],queueIndex:-1,
  lyricLines:[],lyricIndex:-1,adaptedLines:[],   // adaptedLines：适配为原版秒制 Line 的歌词
  coverUrl:null,songTitle:null,songArtist:null,songAlbum:null, // 歌曲元信息（主题取色/模式帧驱动用）
  rms:0,peak:0,bass:0,mid:0,treble:0,
  isFavorited:false,
  coverBlur:Boolean(localStorage.getItem('folia-coverBlur')==='1')
};

// ===== 新歌词体系全局状态 =====
var currentAnimMode='classic';      // 当前动画模式 id（启动时经 FoliaRegistry.resolveId 恢复，兼容旧 id）
var currentIntensity='normal';      // 动画强度 calm/normal/chaotic
var currentTheme=Object.assign({},window.FoliaTheme.DEFAULT_THEME,{animationIntensity:currentIntensity}); // 当前主题（初始值；启动段经 resolveActiveTheme 重解析，默认模式下切歌由封面取色更新）
var backgroundMode=localStorage.getItem('folia-backgroundMode')||'common'; // 当前背景模式
var randomModePerSong=localStorage.getItem('folia-randomModePerSong')==='true'; // 每首歌随机动画
var lastSongKeyForTheme=null;       // 主题取色去重（songKey）
var lastSongKeyForRandom=null;      // 每歌随机去重
var lastCoverForBg=null;            // 背景封面去重（切歌后推送 setCoverUrl）
var lastFrameNow=0;                 // 帧间隔 dt 计算
var activeMode=null;                // 当前模式实例（FoliaRegistry.switchMode 返回）
var switchingMode=false;            // 模式切换中标记
var activeBg=null;                  // 当前背景实例（FoliaBackgrounds.switchBackground 返回）
var mainModePaused=false;           // 样式设置窗口打开时暂停主页面模式（GPU 让给预览舞台）
var frameListeners=[];              // 实时帧订阅（样式设置窗口的实时预览源）
// 宿主窗口背景有效状态（echo-folia:window-background / echo-folia:init 推送）：
// { enabled:窗口背景是否开启, frosted:毛玻璃, opacity:背景不透明度 0~1, keepOnBlur:失焦保持毛玻璃 }，transparent 背景消费
var windowBgState={enabled:false,frosted:false,opacity:1,keepOnBlur:false,activeEnabled:false};

// 歌词时间矫正（秒），正值让歌词提前，负值延后。
// 只平移"歌词时间轴"，绝不修改真实播放进度（进度条/时间数字不受影响）。
var lyricTimeOffset=Number(localStorage.getItem('folia-timeOffset'))||0;
function clampRange(v,a,b){return Math.max(a,Math.min(b,v))}
// 归一化歌词时间矫正：限制在正负 10 秒并吸附到 0.1 秒
function normalizeLyricTimeOffset(v){
  var n=Number(v);
  if(!isFinite(n))n=0;
  return Math.round(clampRange(n,-10,10)*10)/10;
}
// 返回只用于歌词显示的矫正后播放时间(ms)，不影响真实播放进度
function effectiveLyricTimeMs(){
  return getLocalTimeMs()+normalizeLyricTimeOffset(lyricTimeOffset)*1000;
}
// 格式化为 +1.2s / -0.5s / 0.0s
function formatLyricTimeOffset(v){
  var s=normalizeLyricTimeOffset(v);
  return (s>0?'+':(s<0?'-':''))+Math.abs(s).toFixed(1)+'s';
}

// 本地时间外推: 在两次宿主 position 消息之间自行推进时间
var lastPositionMs=0;       // 宿主发来的时间戳
var lastPositionAtMs=0;     // 收到时的 Date.now()
var extrapolateSpeed=1;     // 播放速率

// ===== 工具 =====
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function formatTime(ms){var s=Math.floor(ms/1000),m=Math.floor(s/60);s%=60;return m+':'+(s<10?'0':'')+s}
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
// 获取本地外推时间(ms): 宿主时间 + 播放中经过的本地时间差
function getLocalTimeMs(){
  if(!S.isPlaying)return lastPositionMs;
  return lastPositionMs+(Date.now()-lastPositionAtMs)*extrapolateSpeed;
}

// ===== 歌词过滤工具 =====
function activeLyricFilterMatcher(){
  if(lyricFilterEnabled===false)return null
  var pattern=lyricFilterRegex||DEFAULT_LYRIC_FILTER_REGEX
  if(!pattern)return null
  try{return new RegExp(pattern)}catch(e){return null}
}
function lyricLineMatchesFilter(line,matcher){
  if(!matcher||!line)return false
  var text=String(line.text||line.secondary||'')
  if(!text)return false
  matcher.lastIndex=0
  return matcher.test(text)
}
function buildLyricFilterFallbackLine(line){
  var track=S.track||{}
  var title=String((track&&(track.name||track.title))||'').trim()||'未知歌曲'
  var artist=String((track&&track.artist)||'').trim()||'未知歌手'
  return{
    time_ms:line?line.time_ms:0,
    text:title+' - '+artist,
    secondary:'',characters:[],
    duration_ms:line?line.duration_ms:4000
  }
}
function filterLyricLines(lines){
  if(!Array.isArray(lines)||!lines.length)return[]
  var matcher=activeLyricFilterMatcher()
  if(!matcher)return lines
  var output=[]
  var insertedFallback=false
  for(var i=0;i<lines.length;i++){
    if(!lyricLineMatchesFilter(lines[i],matcher)){
      output.push(lines[i])
      continue
    }
    if(!output.length&&!insertedFallback){
      output.push(buildLyricFilterFallbackLine(lines[i]))
      insertedFallback=true
    }
  }
  return output
}
function reFilterLyrics(){
  S.lyricLines=filterLyricLines(rawLyricLines)
  // 重新适配为原版秒制 Line 并推送给当前模式
  S.adaptedLines=window.FoliaLyricsData.adaptLines(S.lyricLines)
  S.lyricIndex=-1
  pushAdaptedLinesToMode()
}
function saveLyricFilterSettings(){
  try{
    localStorage.setItem('folia-lyricFilterEnabled',lyricFilterEnabled?'true':'false')
    localStorage.setItem('folia-lyricFilterRegex',lyricFilterRegex)
  }catch(e){console.warn('[Folia] 保存歌词过滤设置失败',e)}
}

// ===== 模式/背景调度（经注册表，替代旧 modeMap 分发） =====
var geoLayer=document.getElementById('geo-layer'); // 旧几何背景层（已由新背景系统接管，保持隐藏）

// 把适配后的歌词行推送给当前模式
function pushAdaptedLinesToMode(){
  if(activeMode&&activeMode.setLines){
    try{activeMode.setLines(S.adaptedLines)}catch(e){}
  }
}

// 把当前强度三档写入主题（模式/背景读取 theme.animationIntensity）
function applyIntensity(theme){
  var out=Object.assign({},theme);
  out.animationIntensity=currentIntensity;
  return out;
}

// 解析当前生效主题：默认/AI主题/自定义三态 + 深浅色（runtime/dual-theme.js）；无该模块回落内置默认
function resolveActiveTheme(){
  if(window.FoliaDualTheme){
    var t=window.FoliaDualTheme.resolveTheme();
    if(t)return Object.assign({},t);
  }
  return Object.assign({},window.FoliaTheme.DEFAULT_THEME);
}

// 主题来源/深浅色变化后：重解析并广播（模式/背景/样式窗口同步）
// 桥接 UI chrome（设置菜单/队列面板/全页底色）的深浅色 token：表面色两套按 daylight 切（照上游 settings kit）
function applyChromeTokens(){
  var dual=window.FoliaDualTheme?window.FoliaDualTheme.getState():null;
  var daylightUi=Boolean(dual&&dual.daylight);

// 切换歌词动画模式（13 种，vendor 与模式脚本由注册表按需懒加载）
async function switchToMode(id){

  activeMode=null; // 先清空引用，避免加载期间 tick 调到已销毁的旧实例
  try{
    var resolvedId=window.FoliaRegistry.resolveId(id);
    activeMode=await window.FoliaRegistry.switchMode(id,document.getElementById('folia-mode-host'),{

// 应用样式参数变化：当前模式实例支持 setTuning 则热更，否则销毁重建（携带新 tuning）
function applyModeTuning(modeId,tuning){
  if(window.FoliaRegistry.resolveId(modeId)!==currentAnimMode)return;
  if(activeMode&&typeof activeMode.setTuning==='function'){
    try{activeMode.setTuning(tuning);return}catch(e){console.warn('[Folia] 模式参数热更失败，转重建',e)}

  window.FoliaRegistry.destroyActive();

// url 网页背景配置：URL 列表存于 localStorage（[{id,url,note}] + 选中 id），设置菜单提供编辑 UI
function urlBgConfig(){

  var selectedId=null;
  try{
    items=JSON.parse(localStorage.getItem('folia-urlBackgrounds')||'[]')||[];
    selectedId=localStorage.getItem('folia-urlBackgroundSelected')||null;
  }catch(e){}
  if(!Array.isArray(items))items=[];
  return{items:items,selectedId:selectedId};

// ===== 网页背景 URL 管理（设置菜单 url-bg-panel） =====
function saveUrlBgConfig(items,selectedId){
  try{
    localStorage.setItem('folia-urlBackgrounds',JSON.stringify(items||[]))
    if(selectedId)localStorage.setItem('folia-urlBackgroundSelected',selectedId)
    else localStorage.removeItem('folia-urlBackgroundSelected')
  }catch(e){console.warn('[Folia] 保存网页背景配置失败',e)}
}
// url 背景下重建背景实例：switchBackground 幂等（同 id 不重配 config），改配置后需销毁重建才生效
function refreshUrlBackground(){
  if(backgroundMode!=='url')return
  window.FoliaBackgrounds.destroyActive()
  activeBg=null
  switchToBackground('url')
}
// 选中态规则与 url.js applySelected 一致：selectedId 匹配项优先，否则第一项
function activeUrlBgId(cfg){
  if(cfg.selectedId){
    for(var i=0;i<cfg.items.length;i++){
      if(cfg.items[i].id===cfg.selectedId)return cfg.selectedId
    }
  }
  return cfg.items.length?cfg.items[0].id:null
}
// 添加网页背景（纯逻辑，UI 在样式设置窗口）：清洗引号/尖括号、自动补协议、去重并选中
function addUrlBgItem(rawUrl){
  var url=String(rawUrl||'').trim()
  if(!url)return false
  // 清洗引号/尖括号（合法 URL 不含这些字符，且避免污染 HTML 属性）
  url=url.replace(/["'<>]/g,'')
  if(!url)return false
  // 无协议前缀时自动补 https://，避免 iframe 解析为相对路径失效
  if(!/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(url))url='https://'+url
  var cfg=urlBgConfig()
  var selectedId=activeUrlBgId(cfg)
  var exists=false
  for(var i=0;i<cfg.items.length;i++){
    if(cfg.items[i].url===url){exists=true;selectedId=cfg.items[i].id;break}
  }
  if(!exists){
    var item={id:'u'+Date.now(),url:url,note:''}
    cfg.items.push(item)
    selectedId=item.id
  }
  saveUrlBgConfig(cfg.items,selectedId)
  refreshUrlBackground()
  return true
}
// 删除网页背景（纯逻辑，UI 在样式设置窗口）
function removeUrlBgItem(id){
  var cfg=urlBgConfig()
  var next=[]
  for(var m=0;m<cfg.items.length;m++){
    if(cfg.items[m].id!==id)next.push(cfg.items[m])
  }
  saveUrlBgConfig(next,cfg.selectedId===id?null:cfg.selectedId)
  refreshUrlBackground()
}
// 选中网页背景（纯逻辑，UI 在样式设置窗口）
function selectUrlBgItem(id){
  var cfg=urlBgConfig()
  saveUrlBgConfig(cfg.items,id)
  refreshUrlBackground()
}

// ===== 透明背景设置（UI 在样式设置窗口「背景」页） =====
// 覆盖值只作用于本插件 scrim（transparent.js setOverlayOpacity），存插件 localStorage，
// 不回写宿主透明度；毛玻璃三段经 echo-folia:command 临时接管宿主设置，退出歌词页由宿主回写。
var transparentOverlay=(function(){
  try{
    var raw=localStorage.getItem('folia-transparentOpacity')
    if(raw===null||raw==='')return null
    var v=Number(raw)
    return Number.isFinite(v)&&v>=0&&v<=100?v:null
  }catch(e){return null}
})()
// 把当前覆盖值同步到透明背景实例（切回 transparent 时 switchToBackground 也会经 config 带入）
function applyTransparentOverlay(){
  if(backgroundMode!=='transparent')return
  if(activeBg&&activeBg.setOverlayOpacity){
    try{activeBg.setOverlayOpacity(transparentOverlay)}catch(e){}
  }
}
// 设置背景透明度（样式设置窗口滑条，0~100；null=清除覆盖跟随宿主）
function setTransparentOverlay(v){
  transparentOverlay=(v===null||v===undefined)?null:Math.min(100,Math.max(0,Math.round(Number(v)||0)))
  try{
    if(transparentOverlay===null)localStorage.removeItem('folia-transparentOpacity')
    else localStorage.setItem('folia-transparentOpacity',String(transparentOverlay))
  }catch(e){}
  applyTransparentOverlay()
  // 同步到宿主：未开窗口背景时宿主临时开透明（transparency=滑块值），已开时仅对齐数值
  if(transparentOverlay!==null)sendCmd('set-window-transparency',{value:transparentOverlay})
  notifyTransparentStateChange()
}
// 毛玻璃三段持久选择：off=关 / foreground=仅前台 / always=始终；null=未设置（跟随宿主）
// 与滑块同模型：进入歌词页自动应用，退出歌词页由宿主回写快照还原
var transparentFrost=(function(){
  try{
    var raw=localStorage.getItem('folia-transparentFrost')
    return raw==='off'||raw==='foreground'||raw==='always'?raw:null
  }catch(e){return null}
})()
// 毛玻璃三段开关：off=关 / foreground=仅前台（失焦退回系统行为）/ always=始终（失焦保持）
function setTransparentFrost(mode){
  if(mode!=='off'&&mode!=='foreground'&&mode!=='always')return
  // 平台不支持窗口背景（activeEnabled=false）时禁用；未开启也允许点击——接管会临时开启
  if(windowBgState.activeEnabled!==true)return
  transparentFrost=mode
  try{localStorage.setItem('folia-transparentFrost',mode)}catch(e){}
  // 走现有 sendCmd 通道（command 平铺顶层），与 executeCommand 的读取格式一致
  sendCmd('set-window-frosted-mode',{mode:mode})
  notifyTransparentStateChange()
}
// 透明背景下的自动接管：滑块有覆盖值而宿主未开窗口背景时请求临时开透明；
// 毛玻璃有持久选择且与宿主当前生效状态不一致时请求应用。仅在收到 init（windowBgState
// 为宿主真实值）后执行，避免启动时误接管
var windowBgInitialized=false
function ensureTransparentTakeover(){
  if(!windowBgInitialized)return
  if(backgroundMode!=='transparent')return
  if(transparentOverlay!==null&&windowBgState.enabled!==true){
    sendCmd('set-window-transparency',{value:transparentOverlay})
  }
  if(transparentFrost!==null){
    var wantFrosted=transparentFrost!=='off'
    var wantKeep=transparentFrost==='always'
    if(windowBgState.frosted!==wantFrosted||(wantFrosted&&windowBgState.keepOnBlur!==wantKeep)){
      sendCmd('set-window-frosted-mode',{mode:transparentFrost})
    }
  }
}
// 透明状态变化通知（窗口打开时刷新其滑条/三段选中态与禁用态）
function notifyTransparentStateChange(){
  if(window.FoliaStyleWindow&&window.FoliaStyleWindow.onTransparentStateChange){
    window.FoliaStyleWindow.onTransparentStateChange()
  }
}
// 兼容旧调用点（宿主推送窗口背景状态时触发窗口刷新）
function syncTransparentPanel(){ notifyTransparentStateChange() }

// 组装背景 config：URL/透明维持原有专用通道；common 覆盖项来自封面模糊开关 + 背景 tuning；
// latent/monet/nomand 经 tuning 数据层（folia-bgtuning-*）下发；sora 无已消费参数
function buildBackgroundConfig(mode){
  if(mode==='url')return urlBgConfig();
  if(mode==='transparent')return{windowBg:windowBgState,overlayOpacity:transparentOverlay};
  if(mode==='common'){
    var common=window.FoliaTunings?window.FoliaTunings.getBgTuning('common'):{opacity:0.75,disableVignette:true};
    return{
      useCoverColorBg:S.coverBlur,
      opacity:common.opacity,
      disableGeometricBackground:false,
      disableVignette:common.disableVignette
    };
  }
  return window.FoliaTunings?window.FoliaTunings.getBgTuning(mode):undefined;
}

function songKeyOf(){
  return S.track?(S.track.id||S.track.hash||null):null;
}

// 切歌处理：封面变更推送背景 + 主题取色更新 + （开启时）每首歌随机动画模式
function onSongMaybeChanged(){
  // 封面变化推送给当前背景（monet/nomand/common/latent 仅经 setCoverUrl 收封面，
  // 且 tick 不消费 frameState.coverUrl，漏推会导致背景停留在上一首封面）；
  // 背景内部另有幂等判断，此处去重避免每次 snapshot 重复触发重建管线
  if(S.coverUrl!==lastCoverForBg){
    lastCoverForBg=S.coverUrl;
    if(activeBg&&activeBg.setCoverUrl){
      try{activeBg.setCoverUrl(S.coverUrl)}catch(e){}
    }
  }
  var key=songKeyOf();
  if(key!==lastSongKeyForTheme){
    lastSongKeyForTheme=key;
    // 换歌：智能动感节拍/鼓点检测清表重测
    if(window.FoliaBeatFx){
      window.FoliaBeatFx.resetForSong();
    }
    // 取色是异步的：先广播默认主题保证即时可用，取色完成后再广播新主题
    // （AI主题/自定义模式下主题由用户固定，不随封面取色变化）
    if(window.FoliaDualTheme&&window.FoliaDualTheme.getState().mode!=='default'){
      refreshTheme();
    }else{
      currentTheme=applyIntensity(Object.assign({},window.FoliaTheme.DEFAULT_THEME));
      broadcastTheme();
      window.FoliaTheme.buildThemeFromCover(S.coverUrl).then(function(t){
        currentTheme=applyIntensity(t);
        broadcastTheme();
      });
    }
  }
  if(randomModePerSong&&key!==lastSongKeyForRandom){
    lastSongKeyForRandom=key;
    // 随机池（样式设置窗口可选）：空池 = 全部模式参与
    var pool=window.FoliaTunings?window.FoliaTunings.getRandomPool():[];
    var opts=window.FoliaRegistry.getModeOptions().filter(function(o){
      return !pool.length||pool.indexOf(o.id)>=0;
    });
    if(opts&&opts.length){
      setAnimMode(opts[Math.floor(Math.random()*opts.length)].id);
    }
  }
}

window.addEventListener('message',function(ev){
  var d=ev.data;
  if(!d||d.source!=='echo-folia-parent')return;
  switch(d.type){
    case'echo-folia:init':
      var init=d.payload||{};
      // 宿主窗口背景初始状态：透明背景在 ready 前已完成挂载，此处补齐状态刷新 scrim
      if(init.windowBackground){
        windowBgState=init.windowBackground;
        if(backgroundMode==='transparent'&&activeBg&&activeBg.setWindowBg){
          try{activeBg.setWindowBg(windowBgState)}catch(e){}
        }
        // 面板滑块/三段开关按初始状态同步一次
        syncTransparentPanel();
        // 宿主未开窗口背景而滑块有覆盖值时，自动请求临时开透明
        windowBgInitialized=true;
        ensureTransparentTakeover();
      }
      hostPlatform=String(init.hostControls?.platform||'').toLowerCase();
      hostCanMiniPlayer=Boolean(init.hostControls?.canShowMiniPlayer);
      hostShowFullscreen=init.hostControls?.showFullscreenButton!==false;
      hostNativeControls=init.hostControls?.nativeWindowControls===true;
      hostControlsInset=Number(init.hostControls?.windowControlsInset)||0;
      syncMacPlatformClass();
      createWindowControls();
      // 应用宿主端保存的设置
      if(init.settings){
        var s=init.settings;
        if(s.animMode){
          // 宿主保存的可能是旧体系 id，先经注册表映射再应用
          var resolvedAnim=window.FoliaRegistry.resolveId(s.animMode);
          if(resolvedAnim!==currentAnimMode){
            setAnimMode(resolvedAnim);
          }else if(window.FoliaStyleWindow&&window.FoliaStyleWindow.onModeChange){
            window.FoliaStyleWindow.onModeChange();
          }
        }
        if(s.intensity){
          currentIntensity=s.intensity;
          // 强度变化立即写入主题并广播给当前模式/背景
          currentTheme=applyIntensity(currentTheme);
          broadcastTheme();
        }
      }
      // 应用宿主歌词字体
      if(init.lyricFontFamily){
        applyLyricFontFamily(init.lyricFontFamily);
      }
      break;
    case'echo-folia:host-controls':
      var hc=d.payload||{};
      hostPlatform=String(hc.platform||'').toLowerCase();
      hostCanMiniPlayer=Boolean(hc.canShowMiniPlayer);
      hostShowFullscreen=hc.showFullscreenButton!==false;
      hostNativeControls=hc.nativeWindowControls===true;
      hostControlsInset=Number(hc.windowControlsInset)||0;
      syncMacPlatformClass();
      createWindowControls();
      break;
    case'echo-folia:snapshot':
      var snap=d.payload;
      S.track=snap.track;S.isPlaying=snap.isPlaying;
      S.currentTimeMs=snap.currentTime*1000;S.durationMs=snap.duration*1000;
      lastPositionMs=S.currentTimeMs;lastPositionAtMs=Date.now();
      S.volume=snap.volume;S.playMode=snap.playMode;
      S.queue=snap.queue||[];S.queueIndex=snap.currentQueueIndex;
      var prevCoverBlur=S.coverBlur;
      S.isFavorited=Boolean(snap.isFavorited);
      S.coverBlur=Boolean(snap.coverBlur);
      // 提取歌曲元信息（主题取色与模式帧驱动使用）
      if(S.track){
        S.coverUrl=S.track.cover||S.track.coverUrl||null;
        S.songTitle=S.track.title||S.track.name||null;
        S.songArtist=S.track.artist||null;
        S.songAlbum=S.track.album||null;
      }else{
        S.coverUrl=null;S.songTitle=null;S.songArtist=null;S.songAlbum=null;
      }
      updatePlayButton();updateProgress();updateCapsuleState();updateModeIcon();updateFavState();updateCtrlFavState();updateSettingsVolume();updateLegacyLayers();renderQueue();
      // 封面模糊开关变化（宿主侧改动）：重建 common 背景流体层配置并通知窗口
      if(prevCoverBlur!==S.coverBlur){
        refreshCommonBackgroundConfig();
        if(window.FoliaStyleWindow&&window.FoliaStyleWindow.onCoverBlurChange){
          window.FoliaStyleWindow.onCoverBlurChange();
        }
      }
      if(settingsOpen&&lastActiveTab==='playlist')renderSmQueue();
      if(settingsOpen)updateSettingsInfo();
      // 切歌检测：主题取色更新 + （开启时）每歌随机动画
      onSongMaybeChanged();
      break;
    case'echo-folia:lyrics':
      rawLyricLines=d.payload.lines||[];
      S.lyricLines=filterLyricLines(rawLyricLines);
      // 适配为原版秒制 Line 结构（秒制时间轴 + words + renderHints）并推送给当前模式
      S.adaptedLines=window.FoliaLyricsData.adaptLines(S.lyricLines);
      S.lyricIndex=-1;
      pushAdaptedLinesToMode();
      break;
    case'echo-folia:position':
      S.currentTimeMs=d.payload.position_ms||0;
      S.durationMs=d.payload.duration_ms||0;
      S.isPlaying=d.payload.is_playing;
      lastPositionMs=S.currentTimeMs;lastPositionAtMs=Date.now();
      extrapolateSpeed=d.payload.is_playing?1:0;
      updatePlayButton();updateProgress();updateCapsuleState();
      // 行切换/逐字状态由主循环 tick 统一驱动（使用矫正后的歌词时间，模式自行处理暂停态）
      break;
    case'echo-folia:spectrum':
      S.rms=d.payload.rms||0;S.peak=d.payload.peak||0;
      // 从 bins 估算频段（值域 0~200：均值/255*200，主循环中归一到 0~1 供模式/背景使用）
      var bins=d.payload.bins||[];
      if(bins.length){
        var bLen=Math.floor(bins.length/3);
        var bassSum=0,midSum=0,trebSum=0;
        for(var i=0;i<bLen;i++)bassSum+=bins[i];
        for(var i=bLen;i<bLen*2;i++)midSum+=bins[i];
        for(var i=bLen*2;i<bins.length;i++)trebSum+=bins[i];
        S.bass=bassSum/bLen/255*200;
        S.mid=midSum/bLen/255*200;
        S.treble=trebSum/(bins.length-bLen*2)/255*200;
      }
      // 智能动感：频谱帧喂给共享节拍检测（实时节拍表 + 底鼓/军鼓），效果强度在样式窗口「全局」tab 配置
      if(window.FoliaBeatFx){
        window.FoliaBeatFx.feedFrame({bins:d.payload.bins||[],rms:S.rms,peak:S.peak,state:d.payload.state||'idle',timePos:d.payload.timePos});
      }
      break;
    case'echo-folia:appearance':
      var appearancePayload=d.payload||{};
      if(appearancePayload.lyricFontFamily){
        applyLyricFontFamily(appearancePayload.lyricFontFamily);
      }
      break;
    case'echo-folia:window-background':
      // 宿主窗口背景有效状态变化（毛玻璃/透明度等）：记录并实时更新 transparent 背景 scrim
      windowBgState=d.payload||{enabled:false,frosted:false,opacity:1,keepOnBlur:false};
      if(backgroundMode==='transparent'&&activeBg&&activeBg.setWindowBg){
        try{activeBg.setWindowBg(windowBgState)}catch(e){}
      }
      // 三段开关选中态/禁用态跟随宿主实际生效值（含临时接管后的回推）
      syncTransparentPanel();
      break;
  }
});

  count.textContent='('+songs.length+')';
  var html='';
  for(var i=0;i<songs.length;i++){
    var s=songs[i];
    var isCurrent=(i===S.queueIndex);
    // 去掉 "歌手 - 歌名" 中的歌手前缀
    var rawTitle=s.title||s.name||'';
    var artist=s.artist||'';
    if(artist&&rawTitle.indexOf(artist)===0){
      rawTitle=rawTitle.substring(artist.length).replace(/^\s*[-–—]\s*/,'');
    }
    html+='<div class="sm-queue-item'+(isCurrent?' current':'')+'" data-i="'+i+'">';
    html+='<div class="qi-title">'+escapeHtml(rawTitle)+'</div>';
    html+='<div class="qi-artist">'+escapeHtml(artist.replace(/\s*[、]\s*/g,'/'))+'</div>';
    html+='</div>';
  }
  list.innerHTML=html;
  // 绑定点击
  var items=list.querySelectorAll('.sm-queue-item');
  for(var j=0;j<items.length;j++){
    items[j].addEventListener('click',function(){
      var idx=parseInt(this.getAttribute('data-i'));
      sendCmd('play-index',{index:idx});
      renderSmQueue();
    });
  }
}

// 进度条拖动/点击 - 使用 Pointer Events + capture
var progressEl=document.getElementById('ctrl-progress');
var progressFillEl=document.getElementById('progress-fill');
var isDraggingProgress=false;
function seekFromEvent(e){
  var rect=progressEl.getBoundingClientRect();
  var pct=clamp((e.clientX-rect.left)/Math.max(1,rect.width),0,1);
  var valueSec=pct*(S.durationMs/1000);  // 宿主 seek 接收秒
  sendCmd('seek',{value:valueSec});
  progressFillEl.style.width=(pct*100)+'%';
  // 同步主循环的写入游标，避免拖动写入被差分逻辑跳过或立刻覆盖
  lastWrittenPct=pct*100;
}
progressEl.addEventListener('pointerdown',function(e){
  e.preventDefault();e.stopPropagation();
  if(progressEl.setPointerCapture)progressEl.setPointerCapture(e.pointerId);
  isDraggingProgress=true;
  seekFromEvent(e);
},true);
progressEl.addEventListener('pointermove',function(e){
  if(!isDraggingProgress)return;
  e.preventDefault();e.stopPropagation();
  seekFromEvent(e);
},true);
progressEl.addEventListener('pointerup',function(e){
  isDraggingProgress=false;
  e.preventDefault();e.stopPropagation();
  seekFromEvent(e);
},true);
progressEl.addEventListener('click',function(e){
  e.preventDefault();e.stopPropagation();
  seekFromEvent(e);
},true);

// ===== 主循环 =====
// 频段归一化：S.bass/mid/treble 为 0~200 值域（bins 均值/255*200），这里 /200 归一到 0~1
function normBand(v){return clamp((Number(v)||0)/200,0,1)}
// 组装音频频段（0~1），模式/背景内部按需 ×255 还原原版值域。
// 模块级单对象反复覆写：所有模式/背景都是每帧现读属性、不跨帧快照引用，
// 复用省去每帧两次的对象分配（原实现 mode.tick 与 bg.tick 各 build 一次）
var sharedAudioBands={bass:0,lowMid:0,mid:0,vocal:0,treble:0};
function buildAudioBands(){
  var b=normBand(S.bass),m=normBand(S.mid),t=normBand(S.treble);
  sharedAudioBands.bass=b;
  sharedAudioBands.lowMid=b*0.6+m*0.4;
  sharedAudioBands.mid=m;
  sharedAudioBands.vocal=m;
  sharedAudioBands.treble=t;
  return sharedAudioBands;
}
var timeCurrentEl=document.getElementById('time-current');
// DOM 差分游标：同一秒内不重写时间文本，进度变化不足阈值不重写宽度（写入本身带 0.1s transition）
var lastShownSecond=-1;
var lastWrittenPct=-1;
function tick(now){
  var dt=lastFrameNow?Math.min((now-lastFrameNow)/1000,0.05):1/60;
  lastFrameNow=now;
  // 智能动感节拍时钟：每帧推进包络（暂停时只衰减，seek 由 feedFrame 内部处理）
  if(window.FoliaBeatFx){
    window.FoliaBeatFx.tick(effectiveLyricTimeMs()/1000,S.isPlaying);
  }
  // 进度条/时间文本：始终使用真实播放时间（不受歌词时间矫正影响）
  var localT=getLocalTimeMs();
  if(S.durationMs>0){
    var pct=clamp((localT/S.durationMs)*100,0,100);
    if(Math.abs(pct-lastWrittenPct)>0.05){
      lastWrittenPct=pct;
      progressFillEl.style.width=pct+'%';
    }
    var currentSecond=Math.floor(localT/1000);
    if(currentSecond!==lastShownSecond){
      lastShownSecond=currentSecond;
      timeCurrentEl.textContent=formatTime(localT);
    }
  }
  // 歌词行索引 + 模式帧驱动（矫正后的歌词时间，秒；renderEndTime 内视为活动行，对齐原版行为）
  if(S.adaptedLines.length){
    var lyricT=effectiveLyricTimeMs()/1000;
    var newIdx=window.FoliaLyricsData.findLatestActiveLineIndex(S.adaptedLines,lyricT);
    if(newIdx!==S.lyricIndex)S.lyricIndex=newIdx;
    var frameState=null;
    // 样式设置窗口的实时预览源：窗口打开时每帧分发（节省起见仅在有人订阅时组装）
    if(frameListeners.length){
      frameState={
        currentTime:lyricT,dt:dt,
        currentLineIndex:S.lyricIndex,
        lines:S.adaptedLines,theme:currentTheme,
        audioPower:S.rms,audioBands:buildAudioBands(),
        isPlaying:S.isPlaying,showText:true,
        songTitle:S.songTitle,songArtist:S.songArtist,songAlbum:S.songAlbum,coverUrl:S.coverUrl
      };
      for(var li=0;li<frameListeners.length;li++){
        try{frameListeners[li](frameState)}catch(e){}
      }
    }
    // 主页面模式：窗口打开时暂停（GPU 让给预览舞台），关窗恢复
    if(!mainModePaused&&activeMode&&activeMode.tick){
      if(!frameState){
        frameState={
          currentTime:lyricT,dt:dt,
          currentLineIndex:S.lyricIndex,
          lines:S.adaptedLines,theme:currentTheme,
          audioPower:S.rms,audioBands:buildAudioBands(),
          isPlaying:S.isPlaying,showText:true,
          songTitle:S.songTitle,songArtist:S.songArtist,songAlbum:S.songAlbum,coverUrl:S.coverUrl
        };
      }
      try{activeMode.tick(frameState)}catch(e){console.error('[Folia] 模式 tick 异常',e)}
    }
  }
  // 背景帧驱动（不依赖歌词，暂停时由背景自行冻结；样式窗口打开时暂停主页面背景，GPU 让给预览）
  if(!mainModePaused&&activeBg&&activeBg.tick){
    try{activeBg.tick({audioPower:S.rms,audioBands:buildAudioBands(),isPlaying:S.isPlaying,dt:dt,coverUrl:S.coverUrl})}catch(e){}
  }
  scheduleNextFrame();
}

// 暂停时降频续帧：暂停态仍需低频 tick（lumiere 适配器依赖暂停 tick 检测 seek 补帧、
// 进度/时间控件也要继续走），但无需 60fps 满转；播放恢复后回到 rAF 链
var PAUSED_TICK_INTERVAL_MS=90;
function scheduleNextFrame(){
  if(S.isPlaying){
    requestAnimationFrame(tick);
  }else{
    setTimeout(function(){requestAnimationFrame(tick)},PAUSED_TICK_INTERVAL_MS);
  }
}

// ===== 外观应用（字号/字重/整体透明度，样式设置窗口「字体」页写入） =====
// 字号缩放：保存 + 热更当前模式（各模式均消费 setFontScale）
function applyFontScale(scale){
  var clamped=Math.min(1.4,Math.max(0.85,Number(scale)||1));
  window.FoliaTunings.setAppearance({fontScale:clamped});
  if(activeMode&&typeof activeMode.setFontScale==='function'){
    try{activeMode.setFontScale(clamped)}catch(e){}
  }
  if(window.FoliaStyleWindow&&window.FoliaStyleWindow.onAppearanceChange){
    window.FoliaStyleWindow.onAppearanceChange();
  }
}
// 字重：写 CSS 变量 --lyric-font-weight（模式经 foliaGetLyricFontWeight 取值；0=自动）
function applyFontWeight(weight){
  window.FoliaTunings.setAppearance({fontWeight:Math.round(Number(weight)||0)});
  applyLyricFontWeight();
  if(window.FoliaStyleWindow&&window.FoliaStyleWindow.onAppearanceChange){
    window.FoliaStyleWindow.onAppearanceChange();
  }
}
// 整体透明度：作用于歌词模式层容器（背景层不受影响，对齐上游 visualizerOpacity 语义）
function applyVisualizerOpacity(opacity){
  var clamped=Math.min(1,Math.max(0.2,Number(opacity)||1));
  window.FoliaTunings.setAppearance({visualizerOpacity:clamped});
  var host=document.getElementById('folia-mode-host');
  if(host)host.style.opacity=String(clamped);
  if(window.FoliaStyleWindow&&window.FoliaStyleWindow.onAppearanceChange){
    window.FoliaStyleWindow.onAppearanceChange();
  }
}

// ===== 对样式设置窗口的桥接 API =====
// 窗口（window/style-window.js）运行于同一 iframe，直接调用 bridge 内部函数与状态；
// 回调（onModeChange 等）由窗口按需挂到 window.FoliaStyleWindow 上
window.FoliaBridge={
  // 状态读取（返回快照副本，避免窗口直接持有内部引用）
  getState:function(){
    var appearance=window.FoliaTunings?window.FoliaTunings.getAppearance():null;
    return{
      animMode:currentAnimMode,
      intensity:currentIntensity,
      backgroundMode:backgroundMode,
      randomModePerSong:randomModePerSong,
      theme:currentTheme,
      track:S.track,
      isPlaying:S.isPlaying,
      adaptedLines:S.adaptedLines,
      lyricIndex:S.lyricIndex,
      currentTimeMs:getLocalTimeMs(),
      coverUrl:S.coverUrl,
      songTitle:S.songTitle,
      songArtist:S.songArtist,
      rms:S.rms,
      coverBlur:S.coverBlur,
      windowBgState:windowBgState,
      transparentOverlay:transparentOverlay,
      transparentFrost:transparentFrost,
      lyricFilterEnabled:lyricFilterEnabled,
      lyricFilterRegex:lyricFilterRegex,
      defaultLyricFilterRegex:DEFAULT_LYRIC_FILTER_REGEX,
      lyricTimeOffset:normalizeLyricTimeOffset(lyricTimeOffset),
      appearance:appearance,
      settingsOpen:settingsOpen
    };
  },
  // 样式（动画 tab）
  setAnimMode:setAnimMode,
  setIntensity:setIntensity,
  applyModeTuning:applyModeTuning,
  setRandomPerSong:setRandomPerSong,
  // 背景 tab
  setBackgroundMode:setBackgroundMode,
  applyBgTuning:function(bgId,tuning){
    if(window.FoliaBackgrounds.resolveId(bgId)!==backgroundMode)return;
    // 背景实例无热更接口：销毁重建（switchBackground 幂等，同 id 不重配 config，须先销毁）
    if(window.FoliaBackgrounds.destroyActive)window.FoliaBackgrounds.destroyActive();
    activeBg=null;
    switchToBackground(backgroundMode);
  },
  setCoverBlur:setCoverBlur,
  setTransparentOverlay:setTransparentOverlay,
  setTransparentFrost:setTransparentFrost,
  // URL 背景（背景 tab 网页面板）
  getUrlBgConfig:urlBgConfig,
  addUrlBgItem:addUrlBgItem,
  removeUrlBgItem:removeUrlBgItem,
  selectUrlBgItem:selectUrlBgItem,
  // 字体 tab
  applyFontScale:applyFontScale,
  applyFontWeight:applyFontWeight,
  applyVisualizerOpacity:applyVisualizerOpacity,
  // 全局 tab（歌词过滤/时间矫正）
  setLyricFilterEnabled:setLyricFilterEnabled,
  applyLyricFilterRegex:applyLyricFilterRegex,
  resetLyricFilterRegex:resetLyricFilterRegex,
  setLyricTimeOffset:setLyricTimeOffset,
  // 主题（默认/AI主题/自定义 + 深浅色，runtime/dual-theme.js）
  getDualThemeState:function(){
    return window.FoliaDualTheme?window.FoliaDualTheme.getState():{mode:'default',daylight:false,ai:null,custom:null};
  },
  setThemeMode:function(mode){
    if(window.FoliaDualTheme)window.FoliaDualTheme.setMode(mode);
    refreshTheme();
  },
  setDaylight:function(daylight){
    if(window.FoliaDualTheme)window.FoliaDualTheme.setDaylight(Boolean(daylight));
    refreshTheme();
  },
  // 生成AI主题：封面取色 + 内置生成算法（上游无 AI key 时的同款回退路径）
  generateAiTheme:function(){
    var dual=window.FoliaDualTheme;
    if(!dual)return Promise.resolve(null);
    return dual.generateFromCover(S.coverUrl).then(function(theme){
      dual.setAiTheme(theme);
      refreshTheme();
      return dual.getState();
    });
  },
  saveAiTheme:function(theme){
    if(window.FoliaDualTheme)window.FoliaDualTheme.setAiTheme(theme);
    refreshTheme();
    return window.FoliaDualTheme?window.FoliaDualTheme.getState():null;
  },
  saveCustomTheme:function(theme){
    if(window.FoliaDualTheme)window.FoliaDualTheme.setCustomTheme(theme);
    refreshTheme();
    return window.FoliaDualTheme?window.FoliaDualTheme.getState():null;
  },
  // 手动导入 AI 主题（JSON 文本；解析失败返回 null）
  importAiThemeJson:function(text){
    var dual=window.FoliaDualTheme;
    if(!dual||typeof text!=='string')return null;
    try{
      var parsed=JSON.parse(text);
      dual.setAiTheme(dual.sanitizeDualTheme(parsed));
      refreshTheme();
      return dual.getState();
    }catch(e){return null}
  },
  // 实时预览帧订阅（实时源）：返回注销函数
  onFrame:function(cb){
    if(typeof cb!=='function')return function(){};
    frameListeners.push(cb);
    return function(){
      var idx=frameListeners.indexOf(cb);
      if(idx>=0)frameListeners.splice(idx,1);
    };
  },
  // 主页面模式暂停（窗口打开时暂停主页面渲染，GPU 让给预览舞台）
  setMainModePaused:function(paused){ mainModePaused=Boolean(paused) },
  // 「显示副歌词」开关变化（样式窗口「字幕」页）：通知当前模式（町景 NEXT 全息面板显隐）
  onSubtitleEnabledChange:function(enabled){
    if(activeMode&&activeMode.setSubtitleEnabled){
      try{activeMode.setSubtitleEnabled(enabled!==false)}catch(e){}
    }
  },
  sendCmd:sendCmd
};

// ===== 启动 =====
// 恢复动画模式：localStorage 可能存的是旧体系 id，经注册表映射；默认 classic（流光，与原版一致）
currentAnimMode=window.FoliaRegistry.resolveId(localStorage.getItem('folia-animMode')||'classic');
// 初始化主题（默认/AI主题/自定义三态解析 + 当前强度；默认模式下切歌后由封面取色异步更新）
currentTheme=applyIntensity(resolveActiveTheme());
applyChromeTokens();
// 恢复外观设置（字重 CSS 变量 + 模式层整体透明度）
applyLyricFontWeight();
(function(){
  var appearance=window.FoliaTunings?window.FoliaTunings.getAppearance():null;
  if(appearance){
    var modeHost=document.getElementById('folia-mode-host');
    if(modeHost)modeHost.style.opacity=String(appearance.visualizerOpacity);
  }
})();
// 挂载初始模式与背景（vendor 与脚本由注册表按需懒加载；switchToMode 携带保存的 tuning 与字号）
switchToMode(currentAnimMode);
switchToBackground(backgroundMode);
// 旧背景兼容层初始显隐（geo-layer 恒隐藏）
updateLegacyLayers();
// 样式设置窗口入口（设置子页顶部入口按钮，窗口模块未加载时不可用）
var styleEntryBtn=document.getElementById('sm-btn-style-window');
if(styleEntryBtn){
  styleEntryBtn.onclick=function(){
    if(window.FoliaStyleWindow&&window.FoliaStyleWindow.open){
      window.FoliaStyleWindow.open();
    }
  };
}
requestAnimationFrame(tick);
parent.postMessage({source:'echo-folia-child',type:'echo-folia:ready'},'*');

})();
